name: Security Assurance Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run full test suite
        run: |
          python -m pytest -q

      - name: Require external policy trust anchor
        env:
          POLICY_MANIFEST_PUBLIC_KEY_B64: ${{ vars.POLICY_MANIFEST_PUBLIC_KEY_B64 }}
        run: |
          if [ -z "$POLICY_MANIFEST_PUBLIC_KEY_B64" ]; then
            echo "POLICY_MANIFEST_PUBLIC_KEY_B64 repository variable is required"
            exit 1
          fi

      - name: Verify security gate policy integrity
        env:
          POLICY_SIGNER_REGISTRY_SHA256: ${{ vars.POLICY_SIGNER_REGISTRY_SHA256 }}
        run: |
          if [ -z "$POLICY_SIGNER_REGISTRY_SHA256" ]; then
            echo "POLICY_SIGNER_REGISTRY_SHA256 repository variable is required"
            exit 1
          fi

          python scripts/verify_security_policy_integrity.py \
            --policy-dir policies/security-gates \
            --manifest policies/security-gates/trusted-manifest.json \
            --signer-registry policies/security-gates/trusted-policy-signers.json \
            --signer-registry-sha256 "$POLICY_SIGNER_REGISTRY_SHA256" \
            --output ci-policy-integrity/security_policy_integrity.json

      - name: Prepare passing assessment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("schemas/finding-example.json")
          output = Path("/tmp/passing-assessment.json")

          assessment = json.loads(
              source.read_text(encoding="utf-8")
          )

          for finding in assessment.get(
              "findings",
              [],
          ):
              finding["baseline_severity"] = "medium"
              finding["status"] = "remediated"

          execution = (
              assessment
              .setdefault("assessment", {})
              .setdefault("execution", {})
          )

          execution["summary"] = {
              "executed": len(
                  assessment.get("findings", [])
              ),
              "dry_run": 0,
              "blocked": 0,
              "failed": 0,
          }

          output.write_text(
              json.dumps(
                  assessment,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          print(output)
          PY

      - name: Verify passing security gate
        run: |
          python scripts/generate_assurance_report.py \
            --assessment /tmp/passing-assessment.json \
            --trust-report report/trust_decision_report.json \
            --output-dir ci-assurance-pass \
            --report-id CI-GATE-PASS \
            --generated-at 2026-10-03T10:00:00+00:00 \
            --environment production \
            --enforce-gate

      - name: Verify unsafe assessment is blocked
        run: |
          set +e

          python scripts/generate_assurance_report.py \
            --assessment schemas/finding-example.json \
            --trust-report report/trust_decision_report.json \
            --output-dir ci-assurance-blocked \
            --report-id CI-GATE-BLOCKED \
            --generated-at 2026-10-03T10:00:00+00:00 \
            --environment production \
            --enforce-gate

          exit_code=$?

          set -e

          echo "Observed gate exit code: $exit_code"

          if [ "$exit_code" -ne 2 ]; then
            echo "Expected security gate exit code 2"
            exit 1
          fi

          echo "Unsafe assessment correctly blocked"

      - name: Verify production policy context
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path

          paths = [
              Path(
                  "ci-assurance-pass/"
                  "security_gate_result.json"
              ),
              Path(
                  "ci-assurance-blocked/"
                  "security_gate_result.json"
              ),
          ]

          for path in paths:
              result = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )

              context = result.get(
                  "policy_context",
                  {},
              )

              assert (
                  context.get("environment")
                  == "production"
              )

              assert (
                  context.get("policy_name")
                  == "production-security-gate"
              )

              print(
                  path,
                  "->",
                  context.get("policy_name"),
              )
          PYCODE

      - name: Show gate decisions
        if: always()
        run: |
          echo "----- PASSING GATE -----"
          cat ci-assurance-pass/security_gate_result.json || true

          echo "----- BLOCKED GATE -----"
          cat ci-assurance-blocked/security_gate_result.json || true

      - name: Upload assurance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-assurance-gate-results
          path: |
            ci-policy-integrity/
            ci-assurance-pass/
            ci-assurance-blocked/
