name: Production Secure Deployment CI

on:
  push:
    branches:
      - production-secure-deployment-lab
    paths:
      - "labs/production-secure-deployment-lab/**"
      - ".github/workflows/production-secure-deployment.yml"

  pull_request:
    paths:
      - "labs/production-secure-deployment-lab/**"
      - ".github/workflows/production-secure-deployment.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ci-test-password
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD: ci-test-password

    defaults:
      run:
        working-directory: labs/production-secure-deployment-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python3 -m py_compile app/app.py

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool monitoring/grafana/dashboards/production-overview.json >/dev/null

      - name: Build application image
        run: docker compose build app

      - name: Runtime smoke test
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml up -d db app

          for i in {1..20}; do
            if docker compose -f compose.yaml -f compose.ci.yaml exec -T app python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2).read().decode())'; then
              exit 0
            fi
            sleep 2
          done

          docker compose -f compose.yaml -f compose.ci.yaml logs app db
          exit 1

      - name: Stop test stack
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v
