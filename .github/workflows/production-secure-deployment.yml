name: Production Secure Deployment CI

on:
  push:
    branches:
      - production-secure-deployment-lab
    paths:
      - "labs/production-secure-deployment-lab/**"
      - ".github/workflows/production-secure-deployment.yml"

  pull_request:
    paths:
      - "labs/production-secure-deployment-lab/**"
      - ".github/workflows/production-secure-deployment.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ci-test-password
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD: ci-test-password

    defaults:
      run:
        working-directory: labs/production-secure-deployment-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python3 -m py_compile app/app.py

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool monitoring/grafana/dashboards/production-overview.json >/dev/null

      - name: Build application image
        run: docker compose build app
